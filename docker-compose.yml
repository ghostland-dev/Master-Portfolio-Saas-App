
services:
  # Next.js Frontend
  portfolio-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    env_file:
      - .env  # Make sure this .env file exists in the root of your project
    ports:
      - "3000:3000"
    depends_on:
      - portfolio-backend
    networks:
      - app-network

  # Directus Backend
  portfolio-backend:
    build:
      context: .
      dockerfile: Dockerfile.directus
    container_name: portfolio-backend
    ports:
      - "8055:8055"
    environment:
      - DIRECTUS_DB_CLIENT=pg
      - DIRECTUS_DB_HOST=postgres
      - DIRECTUS_DB_PORT=5432
      - DIRECTUS_DB_DATABASE=directus
      - DIRECTUS_DB_USER=root
      - DIRECTUS_DB_PASSWORD=root
    depends_on:
      - postgres
    networks:
      - app-network
  # Directus 
  directus:
      image: directus/directus:latest
      ports:
          - 8055:8055
      volumes:
          - ./database:/directus/database
          - ./uploads:/directus/uploads
          - ./extensions:/directus/extensions
      environment:
          SECRET: "replace-with-random-value"
          ADMIN_EMAIL: "admin@example.com"
          ADMIN_PASSWORD: "d1r3ctu5"
          DB_CLIENT: "sqlite3"
          DB_FILENAME: "/directus/database/data.db"
          WEBSOCKETS_ENABLED: "true"
      networks:
          - app-network

  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_db_master
      POSTGRES_USER: portfolio_db_admin
      POSTGRES_PASSWORD: SSp9w30QQlb7NpE7pY4IRhibLFOBlG9lhz2BgvTVLPrMUs3rv21q75DLJSf0H+Hy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  postgres_data:
